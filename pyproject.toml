[project]
name = "global-market-predictor"
version = "2.0.0"
description = "Quantile ML stock forecasts, multi-engine ratings, news sentiment and out-of-sample backtests."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
